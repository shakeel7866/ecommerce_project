{% extends "base.html" %}

{% block title %}
My Profile
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row">

        <div class="col-md-4">

            <div class="card shadow">

                <div class="card-body text-center">

                    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                    width="120">

                    <h3 class="mt-3">
                        {{ customer[1] }}
                    </h3>

                    <p class="text-muted">
                        Customer Account
                    </p>

                </div>

            </div>

        </div>

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h4>Profile Information</h4>
                </div>

                <div class="card-body">

                    <table class="table">

                        <tr>
                            <th>Name</th>
                            <td>{{ customer[1] }}</td>
                        </tr>

                        <tr>
                            <th>Email</th>
                            <td>{{ customer[2] }}</td>
                        </tr>

                        <tr>
                            <th>Phone</th>
                            <td>{{ customer[3] }}</td>
                        </tr>

                    </table>

                    <a href="/profile/edit"
                    class="btn btn-warning">

                        Edit Profile

                    </a>

                    <a href="/change-password"
                    class="btn btn-danger">

                        Change Password

                    </a>

                    <a href="/my-orders"
                    class="btn btn-success">

                        My Orders

                    </a>

                    <a href="/wishlist"
                    class="btn btn-info text-white">

                        Wishlist

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
