{% extends 'base.html' %}

{% block title %}
Add Order
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h3>Add New Order</h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Customer Name
                            </label>

                            <input
                                type="text"
                                name="customer_name"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Customer Phone
                            </label>

                            <input
                                type="text"
                                name="customer_phone"
                                class="form-control">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Total Amount
                            </label>

                            <input
                                type="number"
                                step="0.01"
                                name="total_amount"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Order Status
                            </label>

                            <select
                                name="order_status"
                                class="form-select">

                                <option value="Pending">
                                    Pending
                                </option>

                                <option value="Processing">
                                    Processing
                                </option>

                                <option value="Completed">
                                    Completed
                                </option>

                                <option value="Cancelled">
                                    Cancelled
                                </option>

                            </select>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success">

                            Save Order

                        </button>

                        <a
                            href="/admin/orders"
                            class="btn btn-secondary">

                            Back

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
