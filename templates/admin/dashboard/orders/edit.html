{% extends 'base.html' %}

{% block title %}Edit Order{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">
            <h3>Edit Order</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Customer Name</label>
                    <input
                        type="text"
                        name="customer_name"
                        class="form-control"
                        value="{{ order[1] }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Customer Phone</label>
                    <input
                        type="text"
                        name="customer_phone"
                        class="form-control"
                        value="{{ order[2] }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Total Amount</label>
                    <input
                        type="number"
                        step="0.01"
                        name="total_amount"
                        class="form-control"
                        value="{{ order[3] }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Order Status</label>

                    <select
                        name="order_status"
                        class="form-select"
                        required>

                        <option value="Pending"
                            {% if order[4] == "Pending" %}selected{% endif %}>
                            Pending
                        </option>

                        <option value="Processing"
                            {% if order[4] == "Processing" %}selected{% endif %}>
                            Processing
                        </option>

                        <option value="Shipped"
                            {% if order[4] == "Shipped" %}selected{% endif %}>
                            Shipped
                        </option>

                        <option value="Delivered"
                            {% if order[4] == "Delivered" %}selected{% endif %}>
                            Delivered
                        </option>

                        <option value="Cancelled"
                            {% if order[4] == "Cancelled" %}selected{% endif %}>
                            Cancelled
                        </option>

                    </select>
                </div>

                <button class="btn btn-warning">
                    Update Order
                </button>

                <a href="/admin/orders"
                class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
