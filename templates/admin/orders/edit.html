{% extends 'base.html' %}

{% block title %}Edit Order{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-warning text-dark">
                    <h3 class="mb-0">Edit Order #{{ order[0] }}</h3>
                </div>

                <div class="card-body">

                    <form method="POST">

                        <!-- Customer Name -->
                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Customer Name
                            </label>

                            <input
                                type="text"
                                name="customer_name"
                                class="form-control"
                                value="{{ order[1] }}"
                                required>

                        </div>


                        <!-- Customer Phone -->
                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Customer Phone
                            </label>

                            <input
                                type="text"
                                name="customer_phone"
                                class="form-control"
                                value="{{ order[2] }}"
                                required>

                        </div>


                        <!-- Total Amount -->
                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Total Amount
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    Rs.
                                </span>

                                <input
                                    type="number"
                                    step="0.01"
                                    name="total_amount"
                                    class="form-control"
                                    value="{{ order[3] }}"
                                    required>

                            </div>

                        </div>


                        <!-- Order Status -->
                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Order Status
                            </label>

                            <select
                                name="order_status"
                                class="form-select"
                                required>

                                <option value="Pending"
                                    {% if order[4] == "Pending" %}
                                        selected
                                    {% endif %}>
                                    Pending
                                </option>

                                <option value="Processing"
                                    {% if order[4] == "Processing" %}
                                        selected
                                    {% endif %}>
                                    Processing
                                </option>

                                <option value="Shipped"
                                    {% if order[4] == "Shipped" %}
                                        selected
                                    {% endif %}>
                                    Shipped
                                </option>

                                <option value="Delivered"
                                    {% if order[4] == "Delivered" %}
                                        selected
                                    {% endif %}>
                                    Delivered
                                </option>

                                <option value="Cancelled"
                                    {% if order[4] == "Cancelled" %}
                                        selected
                                    {% endif %}>
                                    Cancelled
                                </option>

                            </select>

                        </div>


                        <!-- Buttons -->
                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-warning">

                                Update Order

                            </button>

                            <a
                                href="{{ url_for('order.order_list') }}"
                                class="btn btn-secondary">

                                Back

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
