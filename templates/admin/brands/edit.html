{% extends 'base.html' %}

{% block title %}
Edit Brand
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-warning">

                    <h3>Edit Brand</h3>

                </div>

                <div class="card-body">

                    {% with messages = get_flashed_messages(with_categories=true) %}

                        {% if messages %}

                            {% for category, message in messages %}

                                <div class="alert alert-{{ category }}">
                                    {{ message }}
                                </div>

                            {% endfor %}

                        {% endif %}

                    {% endwith %}

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Brand Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="brand_name"
                                value="{{ brand[1] }}"
                                required>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-warning">

                            Update Brand

                        </button>

                        <a
                            href="/admin/brands"
                            class="btn btn-secondary">

                            Back

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
