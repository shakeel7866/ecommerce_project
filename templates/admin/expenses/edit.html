{% extends 'base.html' %}

{% block title %}Edit Expense{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <div>
            <h2 class="mb-0">Edit Expense</h2>

            <small class="text-muted">
                Update business expense
            </small>
        </div>

        <a href="{{ url_for('expense.expense_list') }}"
           class="btn btn-secondary">

            <i class="fas fa-arrow-left"></i>
            Back

        </a>

    </div>


    <div class="card shadow-sm">

        <div class="card-body">

            <form method="POST">

                <div class="row">


                    <!-- Category -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Expense Category
                        </label>

                        <select
                            name="category_id"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Expense Category
                            </option>

                            {% for category in categories %}

                                <option
                                    value="{{ category[0] }}"
                                    {% if category[0] == expense[1] %}
                                    selected
                                    {% endif %}
                                >

                                    {{ category[1] }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- Amount -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Amount (Rs.)
                        </label>

                        <input
                            type="number"
                            name="amount"
                            class="form-control"
                            min="0.01"
                            step="0.01"
                            value="{{ expense[2] }}"
                            required
                        >

                    </div>


                    <!-- Date -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Expense Date
                        </label>

                        <input
                            type="date"
                            name="expense_date"
                            class="form-control"
                            value="{{ expense[3] }}"
                            required
                        >

                    </div>


                    <!-- Description -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <input
                            type="text"
                            name="description"
                            class="form-control"
                            value="{{ expense[4] or '' }}"
                            placeholder="Enter expense details"
                        >

                    </div>

                </div>


                <div class="mt-3">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >

                        <i class="fas fa-save"></i>
                        Update Expense

                    </button>


                    <a
                        href="{{ url_for('expense.expense_list') }}"
                        class="btn btn-secondary"
                    >

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
