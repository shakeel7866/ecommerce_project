{% extends 'base.html' %}

{% block title %}Sales Report{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-4">Sales Report</h2>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

            <tr>

                <th>ID</th>
                <th>Customer</th>
                <th>Invoice</th>
                <th>Total</th>
                <th>Date</th>

            </tr>

        </thead>

        <tbody>

            {% for sale in sales %}

            <tr>

                <td>{{ sale[0] }}</td>
                <td>{{ sale[1] }}</td>
                <td>{{ sale[2] }}</td>
                <td>Rs. {{ sale[3] }}</td>
                <td>{{ sale[4] }}</td>

            </tr>

            {% else %}

            <tr>

                <td colspan="5" class="text-center">

                    No Sales Found

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
